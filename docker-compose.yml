services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edufunhub-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8096:8000"
    volumes:
      - edufunhub-storage:/app/storage
    depends_on:
      - db
    networks:
      - edufunhub-net

  db:
    image: mariadb:11
    container_name: edufunhub-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-edufunhub_root_secret}
      MARIADB_DATABASE: ${DB_DATABASE:-edufunhub}
      MARIADB_USER: ${DB_USERNAME:-edufunhub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-edufunhub_secret}
    volumes:
      - edufunhub-db:/var/lib/mysql
    networks:
      - edufunhub-net

  web:
    image: nginx:alpine
    container_name: edufunhub-web
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    networks:
      - edufunhub-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: edufunhub-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIj...bCJ9
    networks:
      - edufunhub-net

networks:
  edufunhub-net:
    name: edufunhub-net
    driver: bridge

volumes:
  edufunhub-storage:
  edufunhub-db: