services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edufunhub-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8096:8000"
      - "80:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - edufunhub-storage:/app/storage
    depends_on:
      - db
    networks:
      - edufunhub-net

  db:
    image: mariadb:11
    container_name: edufunhub-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
      MARIADB_DATABASE: ${DB_DATABASE:-edufunhub}
      MARIADB_USER: ${DB_USERNAME:-edufunhub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
    volumes:
      - edufunhub-db:/var/lib/mysql
    networks:
      - edufunhub-net

networks:
  edufunhub-net:
    name: edufunhub-net
    driver: bridge

volumes:
  edufunhub-storage:
  edufunhub-db:
