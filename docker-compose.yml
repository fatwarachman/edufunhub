services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edufunhub-app:latest
    container_name: edufunhub-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:8000"
      - "8096:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - edufunhub-storage:/app/storage
    depends_on:
      - db
    networks:
      - edufunhub-net

  dashboard:
    image: edufunhub-app:latest
    pull_policy: never
    container_name: edufunhub-dashboard
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      DB_HOST: edufunhub-db
      SESSION_DRIVER: database
      SESSION_COOKIE: edufunhub-session
      SESSION_PATH: /
      PHP_CLI_SERVER_WORKERS: "4"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -f vendor/autoload.php
        test -f public/build/manifest.json
        mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
        exec php -d opcache.enable_cli=0 artisan serve --host=0.0.0.0 --port=8000 --no-reload
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true
      - type: bind
        source: ./vendor
        target: /app/vendor
        read_only: true
      - edufunhub-dashboard-storage:/app/storage
    tmpfs:
      - /app/bootstrap/cache
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - db
    networks:
      - edufunhub-net

  gateway:
    image: nginx:alpine
    pull_policy: never
    container_name: edufunhub-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    volumes:
      - ./dashboard-gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - edufunhub-net

  db:
    image: mariadb:11
    container_name: edufunhub-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
      MARIADB_DATABASE: ${DB_DATABASE:-edufunhub}
      MARIADB_USER: ${DB_USERNAME:-edufunhub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
    volumes:
      - edufunhub-db:/var/lib/mysql
    networks:
      - edufunhub-net

networks:
  edufunhub-net:
    name: edufunhub-net
    driver: bridge

volumes:
  edufunhub-storage:
  edufunhub-dashboard-storage:
  edufunhub-db:
