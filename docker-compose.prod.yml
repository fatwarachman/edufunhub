# Production stack (edufunhub-prod 172.16.200.23).
# cloudflared -> localhost:8096 -> gateway -> app (Laravel) | game (Go WebSocket).
# Project name stays "edufunhub" so existing volumes (DB, storage) are reused.
name: edufunhub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edufunhub-app:latest
    container_name: edufunhub-app
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - edufunhub-storage:/app/storage
    depends_on:
      - db
    networks:
      - edufunhub-net

  game:
    build:
      context: ./services/game
      dockerfile: Dockerfile
    image: edufunhub-game:latest
    container_name: edufunhub-game
    restart: unless-stopped
    environment:
      GAME_ADDR: ":8090"
      GAME_SERVICE_SECRET: ${GAME_SERVICE_SECRET:?GAME_SERVICE_SECRET is required}
      GAME_RESULT_URL: ${GAME_RESULT_URL:-http://edufunhub-app:8000/api/internal/game-results}
      GAME_QUESTION_BANK_URL: ${GAME_QUESTION_BANK_URL:-http://edufunhub-app:8000/api/internal/question-bank}
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-edufunhub.com,*.edufunhub.com,172.16.200.23:*,localhost:*,127.0.0.1:*}
    expose:
      - "8090"
    networks:
      - edufunhub-net

  gateway:
    image: nginx:alpine
    container_name: edufunhub-gateway
    restart: unless-stopped
    ports:
      - "8096:80"
    volumes:
      - ./deploy/nginx/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      game:
        condition: service_healthy
    networks:
      - edufunhub-net

  db:
    image: mariadb:11
    container_name: edufunhub-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
      MARIADB_DATABASE: ${DB_DATABASE:-edufunhub}
      MARIADB_USER: ${DB_USERNAME:-edufunhub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
    volumes:
      - edufunhub-db:/var/lib/mysql
    networks:
      - edufunhub-net

networks:
  edufunhub-net:
    name: edufunhub-net
    driver: bridge

volumes:
  edufunhub-storage:
  edufunhub-db:
