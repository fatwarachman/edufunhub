# Production stack (edufunhub-prod 172.16.200.23).
# cloudflared -> localhost:8096 -> gateway -> app (Laravel) | game (Go WebSocket).
# Project name stays "edufunhub" so existing volumes (DB, storage) are reused.
name: edufunhub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edufunhub-app:latest
    container_name: edufunhub-app
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - edufunhub-storage:/app/storage
    depends_on:
      - db
    networks:
      - edufunhub-net

  game:
    build:
      context: ./services/game
      dockerfile: Dockerfile
    image: edufunhub-game:latest
    container_name: edufunhub-game
    restart: unless-stopped
    environment:
      GAME_ADDR: ":8090"
      GAME_SERVICE_SECRET: ${GAME_SERVICE_SECRET:?GAME_SERVICE_SECRET is required}
      GAME_RESULT_URL: ${GAME_RESULT_URL:-http://edufunhub-app:8000/api/internal/game-results}
      GAME_QUESTION_BANK_URL: ${GAME_QUESTION_BANK_URL:-http://edufunhub-app:8000/api/internal/question-bank}
      GAME_CROSSWORD_BANK_URL: ${GAME_CROSSWORD_BANK_URL:-http://edufunhub-app:8000/api/internal/crossword-bank}
      GAME_SEQUENCE_BANK_URL: ${GAME_SEQUENCE_BANK_URL:-http://edufunhub-app:8000/api/internal/sequence-bank}
      GAME_SORTER_BANK_URL: ${GAME_SORTER_BANK_URL:-http://edufunhub-app:8000/api/internal/sorter-bank}
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-edufunhub.com,*.edufunhub.com,172.16.200.23:*,localhost:*,127.0.0.1:*}
    expose:
      - "8090"
    networks:
      - edufunhub-net

  # Go chat service (separate container): live delivery of player chat.
  # Laravel stores messages and posts each one to /internal/publish.
  chat:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    image: edufunhub-chat:latest
    container_name: edufunhub-chat
    restart: unless-stopped
    environment:
      CHAT_ADDR: ":8091"
      CHAT_SERVICE_SECRET: ${CHAT_SERVICE_SECRET:-${GAME_SERVICE_SECRET:?GAME_SERVICE_SECRET is required}}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-edufunhub.com,*.edufunhub.com,172.16.200.23:*,localhost:*,127.0.0.1:*}
    expose:
      - "8091"
    networks:
      - edufunhub-net

  # GOWA (go-whatsapp-web-multidevice): WhatsApp notifications. Internal only;
  # Laravel calls its REST API, the admin links a number on /admin/whatsapp.
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.6.0
    container_name: edufunhub-whatsapp
    restart: unless-stopped
    command: ["rest"]
    environment:
      APP_PORT: "3000"
      APP_OS: ${WHATSAPP_DEVICE_NAME:-EduFunHub}
      APP_BASIC_AUTH: ${WHATSAPP_GOWA_USER:-edufunhub}:${WHATSAPP_GOWA_PASSWORD:?WHATSAPP_GOWA_PASSWORD is required}
      APP_UI_ENABLED: "false"
      MCP_ENABLED: "false"
      WHATSAPP_AUTO_REJECT_CALL: "true"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "false"
      WHATSAPP_PRESENCE_ON_CONNECT: unavailable
    volumes:
      - edufunhub-whatsapp:/app/storages
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edufunhub-net

  gateway:
    image: nginx:alpine
    container_name: edufunhub-gateway
    restart: unless-stopped
    ports:
      - "8096:80"
    volumes:
      - ./deploy/nginx/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/updating.html:/usr/share/nginx/edufunhub/updating.html:ro
    depends_on:
      app:
        condition: service_healthy
      game:
        condition: service_healthy
      chat:
        condition: service_healthy
    networks:
      - edufunhub-net

  # Read-only Docker API for the super admin resource monitor (GET containers/info only).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: edufunhub-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - edufunhub-net

  db:
    image: mariadb:11
    container_name: edufunhub-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
      MARIADB_DATABASE: ${DB_DATABASE:-edufunhub}
      MARIADB_USER: ${DB_USERNAME:-edufunhub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-edufunhub_prod_secret_2026}
    volumes:
      - edufunhub-db:/var/lib/mysql
    networks:
      - edufunhub-net

networks:
  edufunhub-net:
    name: edufunhub-net
    driver: bridge

volumes:
  edufunhub-storage:
  edufunhub-db:
  edufunhub-whatsapp:
