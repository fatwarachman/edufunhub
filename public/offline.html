<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd93d">
    <title>EduFunHub · Offline</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: #fffaf0; color: #151b2e;
            font-family: 'Instrument Sans', 'DM Sans', system-ui, -apple-system, sans-serif;
        }
        main {
            width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 28px 22px; text-align: center; background: #fff;
            border: 3px solid #151b2e; border-radius: 22px; box-shadow: 5px 5px 0 #151b2e;
        }
        img { width: 88px; height: 88px; border-radius: 22px; }
        h1 { margin: 0; font-size: 22px; }
        p { margin: 0; line-height: 1.45; }
        .en { font-size: 14px; color: #3d4460; }
        button {
            min-height: 46px; padding: 0 22px; border: 2.5px solid #151b2e; border-radius: 14px;
            background: #ffd93d; color: #151b2e; font: inherit; font-weight: 700; cursor: pointer;
            box-shadow: 2px 2px 0 #151b2e;
        }
        button:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa-192.png" alt="EduFunHub">
        <h1>Kamu sedang offline</h1>
        <p>Sambungkan internet lalu coba lagi. Poin dan game butuh koneksi.</p>
        <p class="en">You are offline. Reconnect to keep playing.</p>
        <button type="button" onclick="location.reload()">Coba lagi · Retry</button>
    </main>
</body>
</html>
