# Production gateway: Laravel app for pages/API, Go game service for gameplay WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
# Keep the original scheme from Cloudflare Tunnel (https) for Laravel URL generation.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 500m;
    # Laravel sends Vite preload Link headers plus session cookies; the default 4k buffer is too small.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location = /game-ws/ws {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /game-ws/sky {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/sky$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /game-ws/duel {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/duel$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /game-ws/train {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/train$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /game-ws/snakes {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/snakes$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /game-ws/crossword {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/crossword$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Floor Drop battle royale: up to 100 players + a host screen per room.
    location = /game-ws/floor-drop {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/floor-drop$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Economy Heist / mystery chest gold quest: up to 60 players + a host screen per room.
    location = /game-ws/economy-heist {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/economy-heist$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Order Rush / Sequence Masters (TKJ): up to 60 players + a host screen per room.
    location = /game-ws/order-rush {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/ws/order-rush$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Room quiz games: Market Math, Number & Letter Garden, Explore Indonesia, Mini Lab.
    location ~ ^/game-ws/(market-math|number-garden|explore-indonesia|mini-lab)$ {
        set $game http://edufunhub-game:8090;
        set $mini $1;
        proxy_pass $game/ws/$mini$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Go chat service: socket + health only, /internal/publish stays private.
    location = /chat-ws/ws {
        set $chat http://edufunhub-chat:8091;
        proxy_pass $chat/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /chat-ws/healthz {
        set $chat http://edufunhub-chat:8091;
        proxy_pass $chat/healthz;
    }
    location = /game-ws/healthz {
        set $game http://edufunhub-game:8090;
        proxy_pass $game/healthz;
    }
    # Results are posted by the Go service on the internal network only.
    location ^~ /api/internal/ {
        return 404;
    }

    # While the app container restarts (deploys), show a friendly page that retries
    # by itself instead of Cloudflare's "Bad gateway".
    location = /__updating.html {
        internal;
        root /usr/share/nginx/edufunhub;
        try_files /updating.html =502;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
    }

    location / {
        set $app http://edufunhub-app:8000;
        proxy_pass $app;
        proxy_intercept_errors off;
        error_page 502 503 504 =503 /__updating.html;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
    }
}
