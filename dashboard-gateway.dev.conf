# Local-only development gateway. Original app keeps ports 80 and 8096.
# Host includes gateway port so Laravel redirects stay on same origin.
map $uri $edufunhub_upstream {
    default                          edufunhub-app:8000;
    ~^/(dashboard|character|grade|player-details|portal|teacher|admin|login|logout|register|forgot-password|reset-password|two-factor-challenge|email|auth)(/|$) edufunhub-dashboard:8000;
    ~^/(games|gamelist|privacy|terms|tutorials|arena|play)(/|$)                                          edufunhub-dashboard:8000;
    ~^/(notifications|vault|chat|ads|locale|feedback|screen-time|leaderboard|ability|a|join|profile|friends|players)(/|$)                                       edufunhub-dashboard:8000;
    ~^/(manifest\.webmanifest|sw\.js|offline\.html|pwa-[a-z0-9-]+\.png)$           edufunhub-dashboard:8000;
    ~^/(landing|new-landing)(/|$)                                                  edufunhub-dashboard:8000;
    ~^/$                                                                           edufunhub-dashboard:8000;
}
map $uri $edufunhub_surface {
    default                          app;
    ~^/(dashboard|character|grade|player-details|portal|teacher|admin|login|logout|register|forgot-password|reset-password|two-factor-challenge|email|auth)(/|$) dashboard;
    ~^/(games|gamelist|privacy|terms|tutorials|arena|play)(/|$)                                          dashboard;
    ~^/(notifications|vault|chat|ads|locale|feedback|screen-time|leaderboard|ability|a|join|profile|friends|players)(/|$)                                       dashboard;
    ~^/(manifest\.webmanifest|sw\.js|offline\.html|pwa-[a-z0-9-]+\.png)$           dashboard;
    ~^/(landing|new-landing)(/|$)                                                  dashboard;
    ~^/$                                                                           dashboard;
}
# Keep the original scheme from Cloudflare Tunnel (https) for Laravel URL generation.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;
    # Laravel sends Vite preload Link headers plus session cookies; the default 4k buffer is too small.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Go game service (separate container). Only the WebSocket + health are public.
    location = /game-ws/ws {
        proxy_pass http://edufunhub-game:8090/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-EduFunHub-Surface game always;
    }
    location = /game-ws/sky {
        proxy_pass http://edufunhub-game:8090/ws/sky$is_args$args;
