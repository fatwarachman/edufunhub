    # Room quiz games: Market Math, Number & Letter Garden, Explore Indonesia, Mini Lab.
    location ~ ^/game-ws/(market-math|number-garden|explore-indonesia|mini-lab)$ {
        proxy_pass http://edufunhub-game:8090/ws/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
