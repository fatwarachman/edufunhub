    }
    # Go chat service (separate container). Only the socket + health are
    # public; /internal/publish stays on the Docker network.
    location = /chat-ws/ws {
        proxy_pass http://edufunhub-chat:8091/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-EduFunHub-Surface chat always;
    }
    location = /chat-ws/healthz {
        proxy_pass http://edufunhub-chat:8091/healthz;
        add_header X-EduFunHub-Surface chat always;
    }
    location = /game-ws/healthz {
        proxy_pass http://edufunhub-game:8090/healthz;
        add_header X-EduFunHub-Surface game always;
    }
    location ^~ /api/internal/ {
        return 404;
    }

    # Serve the locally built assets (bind-mounted) first; fall back to the app image build.
    location ^~ /build/ {
        root /srv/public;
        try_files $uri @app_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @app_assets {
        proxy_pass http://edufunhub-app:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://$edufunhub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header X-EduFunHub-Surface $edufunhub_surface always;
    }
