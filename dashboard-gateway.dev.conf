# Local-only development gateway. Original app keeps ports 80 and 8096.
# Host includes gateway port so Laravel redirects stay on same origin.
map $uri $edufunhub_upstream {
    default                          edufunhub-app:8000;
    ~^/(dashboard|character)(/|$)     edufunhub-dashboard:8000;
}
map $uri $edufunhub_surface {
    default                          app;
    ~^/(dashboard|character)(/|$)     dashboard;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://$edufunhub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header X-EduFunHub-Surface $edufunhub_surface always;
    }
}
