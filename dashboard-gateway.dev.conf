# Local-only development gateway. Original app keeps ports 80 and 8096.
# Host includes gateway port so Laravel redirects stay on same origin.
map $uri $edufunhub_upstream {
    default                          edufunhub-app:8000;
    ~^/(dashboard|character|grade|portal|login|logout|register|forgot-password|reset-password|two-factor-challenge|email|auth)(/|$) edufunhub-dashboard:8000;
    ~^/(games|gamelist|privacy|terms)(/|$)                                          edufunhub-dashboard:8000;
}
map $uri $edufunhub_surface {
    default                          app;
    ~^/(dashboard|character|grade|portal|login|logout|register|forgot-password|reset-password|two-factor-challenge|email|auth)(/|$) dashboard;
    ~^/(games|gamelist|privacy|terms)(/|$)                                          dashboard;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;

    # Go game service (separate container). Only the WebSocket + health are public.
    location = /game-ws/ws {
        proxy_pass http://edufunhub-game:8090/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-EduFunHub-Surface game always;
    }
    location = /game-ws/sky {
        proxy_pass http://edufunhub-game:8090/ws/sky$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-EduFunHub-Surface game always;
    }
    location = /game-ws/healthz {
        proxy_pass http://edufunhub-game:8090/healthz;
        add_header X-EduFunHub-Surface game always;
    }
    location ^~ /api/internal/ {
        return 404;
    }

    # Serve the locally built assets (bind-mounted) first; fall back to the app image build.
    location ^~ /build/ {
        root /srv/public;
        try_files $uri @app_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location @app_assets {
        proxy_pass http://edufunhub-app:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://$edufunhub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header X-EduFunHub-Surface $edufunhub_surface always;
    }
}
